plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rails
  - rubocop-thread_safety

AllCops:
  NewCops: enable
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Rails/I18nLocaleTexts:
  Enabled: false
Rails/SkipsModelValidations:
  AllowedMethods:
    - update_all
Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - config/application.rb
Style/Documentation:
  Enabled: false
